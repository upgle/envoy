# Chapter 1. Envoy와 C++: 언어의 장벽을 넘어

## 1.1 왜 Envoy인가? (Go 개발자를 위한 비유)

여러분이 Go나 Java로 마이크로서비스를 개발할 때, \`Nginx\`나 \`HAProxy\`를 앞단에 두는 것에 익숙할 것입니다. 하지만 Envoy는 조금 다릅니다. Envoy는 **"네트워크를 애플리케이션 로직처럼 프로그래밍 가능하게"** 만듭니다.

\`global_cache\` 필터를 예로 들어봅시다. 이 필터는 들어오는 HTTP 요청을 가로채서:
1.  Redis에 캐시된 응답이 있는지 확인하고 (Lookup)
2.  없으면 백엔드로 요청을 보내되, **동일한 요청이 여러 개면 하나만 보냅니다 (Single Flight)**.
3.  돌아온 응답을 캐시하고 클라이언트에게 반환합니다.

이 로직을 Go로 짠다면 \`http.Middleware\`와 \`singleflight\` 패키지를 쓰면 100줄이면 짤 수 있습니다. 그런데 왜 C++일까요? 그리고 Envoy의 C++ 코드는 여러분이 알던 "C with Class"와 어떻게 다를까요?

## 1.2 Envoy의 스레딩 모델: "One Thread, One Loop"

가장 큰 문화 충격은 **스레딩 모델**입니다.

*   **Java/Go**: 요청이 들어오면 스레드(또는 고루틴)가 할당됩니다. DB 요청을 보내면 그 스레드는 **Block** 됩니다. (\`db.Query()\` 호출 시 멈춤)
*   **Node.js**: 메인 스레드는 하나지만, I/O는 이벤트 루프가 처리합니다.
*   **Envoy**: **Node.js와 똑같습니다.** 하지만 **여러 개의 Node.js 프로세스가 떠 있는 것**과 비슷합니다.

Envoy는 \`Worker Thread\`를 여러 개 띄우지만, 각 스레드는 **완벽하게 독립적인 이벤트 루프(Event Loop)**를 돕니다.
**절대 블로킹되면 안 됩니다.**

> **C++ 코드의 제 1원칙**: \`sleep()\`, \`mutex.lock()\`(오래 걸리는), 동기 소켓 \`read()\`는 금지입니다.

\`GlobalCacheFilter\`가 Redis에 \`GET\`을 요청할 때, C++ 함수는 즉시 리턴됩니다. "나중에 응답 오면 이 함수(Callback) 실행해줘"라고 등록만 하고 끝납니다.

## 1.3 Modern C++: 포인터의 공포를 잊어라

여러분이 학교에서 배운 C++은 잊으세요. \`malloc\`, \`free\`, \`new\`, \`delete\`는 Envoy 코드에 거의 등장하지 않습니다. 대신 **스마트 포인터**가 GC(Garbage Collection) 비슷한 역할을 합니다.

| Go / Java | Modern C++ (Envoy) | 의미 |
| :--- | :--- | :--- |
| \`obj = new MyObject()\` | \`auto obj = std::make_shared<MyObject>()\` | 참조 카운트가 0이 되면 자동 삭제 (GC와 유사) |
| - | \`auto obj = std::make_unique<MyObject>()\` | 오직 나만 소유함. 복사 불가능. (더 빠르고 안전) |
| \`nil\` / \`null\` | \`nullptr\` | 비어 있는 포인터 |
| \`defer func() { ... }\` | \`RAII\` (Resource Acquisition Is Initialization) | 스코프 \`{ }\`를 벗어나면 자동으로 정리 코드가 실행됨 |

# Chapter 2. 필터의 해부: 요청의 생애 (Life of a Request)

Envoy HTTP 필터는 거대한 파이프라인의 부품입니다. \`GlobalCacheFilter\`는 \`StreamDecoderFilter\`(요청 처리)와 \`StreamEncoderFilter\`(응답 처리)를 모두 구현합니다.

## 2.1 주요 진입점: \`decodeHeaders\`

클라이언트가 HTTP 요청을 보내면 가장 먼저 \`decodeHeaders\`가 호출됩니다.

\`\`\`cpp
Http::FilterHeadersStatus GlobalCacheFilter::decodeHeaders(Http::RequestHeaderMap& headers, bool end_stream) {
  // 1. 캐시가 비활성화된 라우트인지 확인
  if (config_->disabled()) {
    return Http::FilterHeadersStatus::Continue;
  }

  // 2. 캐시 키 생성 (Method + Host + Path + Query)
  cache_key_ = generateCacheKey(headers);

  // 3. 캐시 조회 (비동기!)
  // "Look up this key, and call me back when done."
  auto self = shared_from_this(); // 클로저처럼 '나'를 캡처
  cache_backend_->lookup(cache_key_, [self](CacheLookupResult&& result) {
      self->onLookupComplete(std::move(result));
  });

  // 4. "잠깐 멈춰!"
  // Redis 응답이 올 때까지 필터 체인을 멈춥니다.
  return Http::FilterHeadersStatus::StopIterationAndWatermark;
}
\`\`\`

### 코드 해설 (Go 개발자를 위해)
*   \`Http::RequestHeaderMap&\`: 헤더 맵의 **참조(Reference)**입니다. Go의 \`*http.Header\`와 같지만, \`nil\`일 수 없습니다.
*   \`StopIterationAndWatermark\`: Go 미들웨어에서 \`next.ServeHTTP()\`를 호출하지 않고 \`return\`하는 것과 같습니다. "비동기 작업이 남았으니 진행을 멈춰라"는 뜻입니다.
*   \`[self]\`: 람다 캡처(Lambda Capture)입니다. 콜백이 실행될 때까지 \`Filter\` 객체가 파괴되지 않도록 **참조 카운트**를 하나 올리는 중요한 테크닉입니다.

## 2.2 상태 머신 (State Machine)

비동기 프로그래밍은 흐름이 뚝뚝 끊깁니다. 그래서 \`FilterState\`라는 상태 머신이 필요합니다.

<div class="mermaid">
stateDiagram-v2
    [*] --> Initial
    Initial --> CacheHit: Lookup 성공
    Initial --> CacheMiss: Lookup 실패
    
    CacheMiss --> WaitingForUpstream: SingleFlight (이미 요청 중)
    CacheMiss --> Forwarding: SingleFlight (내가 첫 요청)
    
    WaitingForUpstream --> CacheHit: 앞선 요청 완료 (Hit)
    WaitingForUpstream --> Forwarding: Timeout (Miss)
    
    Forwarding --> Caching: Upstream 응답 수신
    Caching --> [*]: 응답 저장 완료
</div>

# Chapter 3. Single Flight: 중복 요청 방지의 미학

캐시가 꺼져 있거나 만료되었을 때, 수천 개의 요청이 동시에 백엔드를 때리는 "Thundering Herd" 문제를 막아야 합니다. Go의 \`singleflight\` 패키지와 같은 역할을 합니다.

## 3.1 구조적 문제: 스레드 안전성

Envoy는 멀티 스레드입니다. \`GlobalCacheFilter\` 인스턴스는 각 스레드마다 별도로 존재합니다. 하지만 **"같은 URL에 대한 요청"**은 서로 다른 스레드에서 동시에 들어올 수 있습니다.

따라서 \`InFlightRequest\` 맵은 **전역적(Static)**이어야 하고, **Mutex**로 보호받아야 합니다.

\`\`\`cpp
// 전역 변수 (모든 스레드 공유)
static std::unordered_map<std::string, std::shared_ptr<InFlightRequest>> in_flight_requests_;
static std::mutex in_flight_mutex_;
\`\`\`

## 3.2 \`weak_ptr\`의 마법: 순환 참조 방지

여기서 C++만의 독특한 포인터인 \`std::weak_ptr\`가 등장합니다.

\`\`\`cpp
struct InFlightRequest {
  // 나를 기다리고 있는 필터들
  std::vector<std::weak_ptr<GlobalCacheFilter>> waiters;
};
\`\`\`

만약 \`waiters\`가 \`std::shared_ptr\`를 가지고 있다면 어떻게 될까요?
1.  필터는 \`InFlightRequest\`를 참조함 (결과를 기다림)
2.  \`InFlightRequest\`는 필터를 참조함 (통지해야 함)
3.  **순환 참조(Cycle)** 발생 -> 메모리 누수 (Memory Leak) -> 영원히 메모리 해제 안 됨.

Go는 GC가 사이클을 찾아내서 수거하지만, C++(Reference Counting)은 못 합니다.
그래서 **"소유권은 없지만, 살아있는지 확인할 수 있는"** \`weak_ptr\`를 사용합니다.

> **비유**: \`weak_ptr\`는 "친구의 전화번호"입니다. 전화를 걸었을 때( \`lock()\` ) 친구가 받으면(객체 존재) 대화하고, "없는 번호"(객체 파괴됨)면 포기하면 됩니다. 친구를 내 집에 감금( \`shared_ptr\` )하지 않습니다.

# Chapter 4. 추상화의 기술: Interface와 Polymorphism

\`GlobalCache\`는 로컬 메모리에도 저장할 수 있고, Redis에도 저장할 수 있습니다. 이를 위해 \`CacheBackend\`라는 인터페이스를 정의합니다.

## 4.1 Pure Virtual Function (순수 가상 함수)

Go의 \`interface\`는 암시적(Implicit)이지만, C++의 인터페이스는 명시적(Explicit)인 상속을 사용합니다.

\`\`\`cpp
class CacheBackend {
public:
  virtual ~CacheBackend() = default; // 소멸자도 가상 함수여야 함 (메모리 누수 방지)

  // = 0 은 "구현이 없다(Abstract)"는 뜻입니다.
  // Go: lookup(key string, cb func(...))
  virtual void lookup(const std::string& key, LookupCallback callback) PURE;
};
\`\`\`

## 4.2 팩토리 패턴 (Factory Pattern)

\`config.cc\`에서는 YAML 설정(Protobuf)을 보고 어떤 구현체를 만들지 결정합니다.

\`\`\`cpp
CacheBackendSharedPtr createCacheBackend(...) {
  if (config.has_redis()) {
    return std::make_shared<RedisCache>(...);
  } else if (config.has_tiered()) {
    return std::make_shared<TieredCache>(...);
  }
  return std::make_shared<LocalCache>(...);
}
\`\`\`

이 부분은 Java의 Factory 패턴이나 Go의 \`New...\` 함수 패턴과 매우 유사합니다. 하지만 리턴 타입이 \`shared_ptr<CacheBackend>\`라는 점이 핵심입니다. 이를 통해 런타임 다형성(Polymorphism)을 구현합니다.

# Chapter 5. Local Cache 구현: 메모리와의 전쟁

로컬 캐시는 가장 빠르지만, 메모리라는 한정된 자원을 사용합니다. \`LocalCache\` 클래스는 LRU(Least Recently Used) 알고리즘을 사용합니다.

## 5.1 C++에서의 LRU 구현

Go나 Java에는 \`LinkedHashMap\` 같은 편리한 자료구조가 있지만, C++ 표준 라이브러리(STL)에는 LRU 맵이 없습니다. 보통 \`std::list\` (이중 연결 리스트)와 \`std::unordered_map\` (해시 맵)을 조합해서 구현합니다.

*   **Map**: Key -> Node Iterator (빠른 검색)
*   **List**: Node들을 사용 순서대로 정렬 (MRU -> ... -> LRU)

## 5.2 \`sizeof\`와 메모리 계산

Java/Go 개발자가 가장 어려워하는 부분입니다. "이 객체가 메모리를 얼마나 차지하나요?"
C++에서는 \`sizeof(T)\`로 객체 자체의 크기는 알 수 있지만, \`std::string\`이나 \`std::vector\`가 힙(Heap)에 동적으로 할당한 메모리는 직접 계산해야 합니다.

\`LocalCache\`는 \`max_bytes\` 설정을 준수하기 위해 들어오는 데이터의 크기를 정밀하게 계산합니다.

\`\`\`cpp
uint64_t calculateSize(const CacheEntry& entry) {
  uint64_t size = 0;
  // Body 버퍼 크기
  size += entry.body.length(); 
  // 헤더 맵 크기 (대략적 추산)
  size += entry.headers->byteSize(); 
  return size;
}
\`\`\`

만약 \`max_bytes\`를 초과하면 리스트의 뒤쪽(LRU)부터 \`pop_back()\` 하여 공간을 확보합니다. 이 수동 메모리 관리가 C++ 시스템 프로그래밍의 핵심이자 고통의 원천입니다.

# Chapter 6. Redis Cache: 비동기 세상의 콜백 지옥

Redis 캐시는 네트워크 I/O를 동반합니다. 절대 블로킹되면 안 됩니다.

## 6.1 Envoy의 Redis Client

Envoy는 자체적인 Redis 클라이언트 구현체를 가지고 있습니다. \`Redis::ConnPool::Instance\`를 사용하여 명령을 보냅니다.

\`\`\`cpp
// 요청 (비동기)
pool_->makeRequest("GET", key, callbacks);
// 함수는 여기서 즉시 리턴됨! 결과는 callbacks.onResponse()로 옴.
\`\`\`

## 6.2 Context 유지하기 (The Context Problem)

비동기 호출 사이에서 "내가 어떤 요청을 처리하고 있었지?"를 기억해야 합니다.
Go에서는 고루틴이 멈춰있으니 지역 변수가 그대로 살아있지만, C++ 비동기 콜백에서는 지역 변수가 다 사라집니다.

그래서 힙(Heap)에 문맥(Context) 객체를 만들어서 넘겨야 합니다.

\`\`\`cpp
// 요청 상태를 저장하는 객체
struct LookupRequest : public Redis::Client::RequestCallbacks {
    std::string key_;
    LookupCallback user_callback_;
    // ...
};

// shared_ptr로 만들어서 Redis 클라이언트에게 넘김
auto req = std::make_shared<LookupRequest>(key, callback);
\`\`\`

이 \`shared_ptr\`가 살아있는 한, 요청 상태도 메모리에서 사라지지 않습니다. Redis 응답이 오면 이 객체의 메서드가 호출되고, 처리가 끝나면 \`shared_ptr\`가 소멸되면서 자동으로 정리됩니다.

# Chapter 7. Tiered Cache: 계층형 캐시의 조율자

\`TieredCache\`는 L1(Local)과 L2(Redis)를 조합합니다. 여기서 흥미로운 문제는 **동시성 제어(Concurrency Control)**입니다.

## 7.1 Write-Through 전략의 구현

\`Write-Through\`는 L1, L2에 모두 쓰기가 완료되어야 "성공"으로 간주합니다. 두 개의 비동기 작업이 언제 끝날지 모릅니다.

1.  L1 Insert 시작 (비동기)
2.  L2 Insert 시작 (비동기)
3.  둘 다 끝나야 \`callback(true)\` 호출

이를 위해 \`CompletionState\`라는 공유 객체를 만들고 \`std::mutex\`로 보호합니다.

\`\`\`cpp
struct CompletionState {
    bool l1_done = false;
    bool l2_done = false;
    std::mutex mutex;
};

auto state = std::make_shared<CompletionState>();
\`\`\`

L1 콜백이 불리면 \`mutex\`를 잠그고 \`l1_done = true\`를 씁니다. 그리고 \`l2_done\`도 true인지 확인합니다. 둘 다 true면 그때 비로소 사용자 콜백을 호출합니다.
Go의 \`WaitGroup\`과 비슷하지만 훨씬 수동적입니다.

# Chapter 8. 직렬화(Serialization): 바이트의 연금술

Redis는 바이너리 안전(Binary Safe)하지만, 구조화된 데이터를 저장하려면 직렬화가 필요합니다. \`cache_serialization.cc\`는 수동으로 데이터를 바이트 배열로 바꿉니다.

## 8.1 왜 Protobuf를 쓰지 않았나?

Envoy는 Protobuf를 사랑합니다. 하지만 캐시 데이터(헤더+바디)는 매우 빈번하게 읽고 쓰입니다. Protobuf의 오버헤드조차 줄이기 위해 간단한 커스텀 포맷을 사용했습니다.

## 8.2 Endianness (엔디안)

네트워크 프로그래밍의 기초입니다. CPU마다 숫자를 저장하는 순서(Little Endian vs Big Endian)가 다릅니다. 네트워크로 데이터를 보낼 때는 반드시 **Network Byte Order (Big Endian)**로 통일해야 합니다.

\`\`\`cpp
// Host to Network Long (내 컴퓨터의 uint32 -> 네트워크용 uint32)
uint32_t network_val = htonl(host_val);
buffer.append(&network_val, 4);
\`\`\`

Go의 \`binary.BigEndian.PutUint32()\`와 정확히 같습니다. 이걸 안 하면, x86 서버에서 저장한 캐시를 ARM 서버(또는 그 반대)에서 읽을 때 숫자가 뒤집혀서 엉망이 됩니다.

# Chapter 9. 설정(Configuration): YAML에서 C++ 객체까지

Envoy 사용자는 YAML로 설정을 작성합니다. 이 YAML은 어떻게 C++ 객체가 될까요?

1.  **proto 파일 정의**: \`global_cache.proto\`에 설정을 정의합니다.
2.  **Factory 등록**: \`REGISTER_FACTORY\` 매크로를 통해 "이 설정은 내 필터가 처리해"라고 등록합니다.
3.  **TypedConfig**: Envoy 로더가 YAML을 파싱해서 Protobuf 객체로 만든 다음, \`GlobalCacheFilterFactory::createFilterFactoryFromProtoTyped\`를 호출합니다.

이 과정은 Spring Framework의 Bean 초기화나, NestJS의 Module 시스템과 유사합니다. 의존성 주입(Dependency Injection)이 일어나는 시점입니다.

# Chapter 10. Trade-offs & 결론

## 10.1 C++로 작성하는 비용

Go나 Java로 짰다면 1주일이면 만들었을 기능을 C++로 짜면서 한 달이 걸렸을 수도 있습니다. (메모리 관리, 비동기 콜백 체인, 빌드 시스템 등)

## 10.2 얻은 것: 예측 가능한 성능

하지만 그 대가로 얻은 것은 **극강의 성능**과 **예측 가능성**입니다.
*   GC Pause가 없습니다. (Tail Latency가 안정적)
*   메모리 사용량을 바이트 단위로 제어할 수 있습니다.
*   CPU 캐시 라인까지 최적화할 수 있습니다.

## 10.3 맺음말

\`global_cache\` 필터는 Envoy의 철학을 잘 보여주는 예제입니다.
*   **비동기 (Async)**: 절대 멈추지 않는다.
*   **추상화 (Abstraction)**: 인터페이스로 구현을 숨긴다.
*   **안전 (Safety)**: 스마트 포인터와 RAII로 메모리 누수를 막는다.

이 책을 통해 Envoy의 블랙박스가 조금은 투명해졌기를 바랍니다. 이제 여러분은 C++ 코드를 두려워하지 않고, 필요한 기능을 직접 수정하거나 기여할 수 있는 준비가 되었습니다.
