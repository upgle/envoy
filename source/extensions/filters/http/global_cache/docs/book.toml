[book]
title = "Envoy Global Cache 필터: 구현부터 운영까지"
authors = ["Envoy Contributors"]
language = "ko"
multilingual = false
src = "book"

[build]
build-dir = "book-output"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/envoyproxy/envoy"
edit-url-template = "https://github.com/envoyproxy/envoy/edit/main/source/extensions/filters/http/global_cache/docs/{path}"
curly-quotes = true
mathjax-support = false
copy-fonts = true
no-section-label = false
additional-js = ["theme/mermaid.min.js", "theme/mermaid-init.js"]

[output.html.print]
enable = true

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false
copyable = true
line-numbers = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
