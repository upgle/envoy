syntax = "proto3";

package envoy.extensions.filters.http.global_cache.v3;

import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.global_cache.v3";
option java_outer_classname = "GlobalCacheProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/http/global_cache/v3;global_cachev3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Global Cache Filter]
// Global Cache filter with in-memory caching and single-flight pattern.
// [#extension: envoy.filters.http.global_cache]

// Configuration for the global cache filter.
message GlobalCache {
  // Timeout for waiting on in-flight requests in the single-flight pattern.
  // If a request is waiting for another in-flight request to complete and this
  // timeout expires, the waiting request will proceed to upstream independently.
  //
  // This prevents requests from waiting indefinitely if the first request is slow
  // or fails. A reasonable value is slightly higher than the expected upstream
  // response time.
  //
  // Default: 5 seconds
  google.protobuf.Duration single_flight_timeout = 1 [(validate.rules).duration = {
    gte {seconds: 0}
    lte {seconds: 300}
  }];

  // Default TTL for cached entries if not specified by response headers.
  // Default: 5 minutes
  google.protobuf.Duration default_ttl = 2 [(validate.rules).duration = {
    gte {seconds: 1}
    lte {seconds: 86400}  // Max 24 hours
  }];

  // Cache backend configuration.
  // If not specified, uses in-memory local cache with default settings.
  CacheBackendConfig cache_backend = 3;

  // Cache key configuration.
  // When unset, defaults to method + host + path (including query parameters).
  CacheKeyConfig cache_key = 4;

  // When true, skip caching any response that includes Cache-Control.
  // Default: true
  google.protobuf.BoolValue skip_if_response_has_cache_control = 5;

  // When true, skip caching any response that includes Set-Cookie.
  // Default: true
  google.protobuf.BoolValue skip_if_response_has_set_cookie = 6;

  // Allowlist of request methods that can be cached.
  // When unset, defaults to GET and HEAD.
  repeated string allowed_methods = 7
      [(validate.rules).repeated = {items {string {min_len: 1 max_len: 32}}}];

  // Allowlist of response status codes that can be cached.
  // When unset, defaults to 2xx.
  repeated uint32 allowed_status_codes = 8
      [(validate.rules).repeated = {items {uint32 {gte: 100 lte: 599}}}];
}

// Cache key configuration for the global cache filter.
message CacheKeyConfig {
  // Whether to include the URL scheme in the cache key.
  // Default: false
  google.protobuf.BoolValue include_scheme = 1;

  // Whether to include the host/authority in the cache key.
  // Default: true
  google.protobuf.BoolValue include_host = 2;

  // Whether to include the URL path in the cache key.
  // Default: true
  google.protobuf.BoolValue include_path = 3;

  // Whether to include query parameters in the cache key.
  // Default: true
  google.protobuf.BoolValue include_query_params = 4;

  // If non-empty, only query parameters with these names are included in the cache key.
  repeated string query_params_included = 5
      [(validate.rules).repeated = {items {string {min_len: 1 max_len: 1024}}}];

  // If non-empty, query parameters with these names are excluded from the cache key.
  repeated string query_params_excluded = 6
      [(validate.rules).repeated = {items {string {min_len: 1 max_len: 1024}}}];

  // Request headers to include in the cache key.
  repeated string headers_included = 7 [(validate.rules).repeated = {
    items {string {min_len: 1 well_known_regex: HTTP_HEADER_NAME strict: false}}
  }];
}

// Per-route configuration for the global cache filter.
message GlobalCachePerRoute {
  oneof override {
    option (validate.required) = true;

    // Disable or re-enable the global cache filter for this route.
    bool disabled = 1;

    // Override cache behavior for this route.
    RouteOverrides overrides = 2 [(validate.rules).message = {required: true}];
  }

  message RouteOverrides {
    // Override default TTL for cached entries.
    google.protobuf.Duration default_ttl = 1 [(validate.rules).duration = {
      gte {seconds: 1}
      lte {seconds: 86400}  // Max 24 hours
    }];

    // Per-route cache key configuration. If set, this fully replaces the filter-level cache key
    // configuration for this route.
    CacheKeyConfig cache_key = 3;

    reserved 2;
  }
}

// Configuration for cache backend (local, Redis, or tiered).
message CacheBackendConfig {
  oneof backend_type {
    option (validate.required) = false;

    // Local in-memory LRU cache.
    LocalCacheConfig local = 1;

    // Redis cache backend (cluster or standalone).
    RedisCacheConfig redis = 2;

    // Two-tier cache: L1 (local) + L2 (Redis).
    TieredCacheConfig tiered = 3;
  }
}

// Configuration for local in-memory LRU cache.
message LocalCacheConfig {
  // Maximum number of entries in the cache.
  // When the limit is reached, least recently used entries are evicted.
  // Default: 1000
  uint32 max_entries = 1 [(validate.rules).uint32 = {
    gte: 1
    lte: 1000000
  }];

  // Maximum total size in bytes for all cached entries.
  // When the limit is reached, least recently used entries are evicted.
  // Default: 104857600 (100 MB)
  uint64 max_bytes = 2 [(validate.rules).uint64 = {gte: 1048576}];  // Min 1 MB
}

// Configuration for Redis cache backend.
message RedisCacheConfig {
  // Name of the upstream cluster running Redis.
  // The cluster must be configured in Envoy's cluster manager.
  string cluster_name = 1 [(validate.rules).string = {min_len: 1}];

  // Timeout for Redis operations (GET, SET, DEL).
  // Default: 100ms
  google.protobuf.Duration op_timeout = 2 [(validate.rules).duration = {
    gte {nanos: 1000000}  // 1ms minimum
    lte {seconds: 10}
  }];

  // Prefix for all cache keys stored in Redis.
  // Useful for namespacing and avoiding key collisions.
  // Default: "envoy:gc:"
  string key_prefix = 3;

  // Enable Redis cluster mode support (MOVED/ASK redirections).
  // Set to false for standalone Redis or Redis Sentinel.
  // Default: true
  bool enable_cluster_mode = 4;
}

// Configuration for two-tier caching (L1 local + L2 Redis).
message TieredCacheConfig {
  // L1 local cache configuration (required).
  LocalCacheConfig l1_local = 1 [(validate.rules).message = {required: true}];

  // L2 Redis cache configuration (required).
  RedisCacheConfig l2_redis = 2 [(validate.rules).message = {required: true}];

  // Write strategy for the tiered cache.
  // Default: WRITE_THROUGH
  WriteStrategy write_strategy = 3;

  enum WriteStrategy {
    // Write to both L1 and L2 synchronously.
    // Insert completes when both succeed.
    // Provides strong consistency but higher latency.
    WRITE_THROUGH = 0;

    // Write to L1 immediately, asynchronously write to L2.
    // Insert completes when L1 succeeds.
    // Faster inserts but L2 may be temporarily inconsistent.
    WRITE_BACK = 1;
  }

  // Whether to populate L1 on L2 hits.
  // When true, entries found in L2 but not L1 are copied to L1.
  // Default: true
  bool populate_l1_on_l2_hit = 4;
}
